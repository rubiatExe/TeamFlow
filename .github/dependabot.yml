version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      npm-runtime:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /services/document-processor
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /services/hiring-agent
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /services/document-processor
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /services/hiring-agent
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: America/New_York
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directory: /ops/observability
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/New_York
    open-pull-requests-limit: 3
