name: Deploy Hiring Agent → Cloud Run

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-hiring-agent
  cancel-in-progress: false
  queue: max

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  predeploy:
    name: Verify Hiring Agent Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      checkpoint-postgres:
        image: postgres:16.15-trixie@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: teamflow_checkpoint_test
          POSTGRES_PASSWORD: teamflow_checkpoint_test
          POSTGRES_DB: teamflow_checkpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow_checkpoint_test -d teamflow_checkpoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DSN: >-
        postgresql://teamflow_checkpoint_test:teamflow_checkpoint_test@127.0.0.1:5432/teamflow_checkpoint_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16
          cache: pip
          cache-dependency-path: services/hiring-agent/requirements-dev.lock

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          --requirement services/hiring-agent/requirements-dev.lock

      - name: Verify static release contracts
        run: |
          node scripts/verify-model-contract.mjs
          node scripts/verify-release-hardening.mjs

      - name: Lint, verify corpus, and test
        working-directory: services/hiring-agent
        run: |
          ruff check .
          ruff format --check .
          python -m teamflow_hiring_agent.evaluation verify --dataset evals/resume_review_v1
          # This gate replaces `python -m pytest tests`; database suites run in CI services.
          python ../../scripts/pytest-no-skips.py -q -rs tests \
            --ignore=tests/test_hiring_reader_migration_phase19.py \
            --ignore=tests/test_hitl_postgres_repository_phase6.py \
            --ignore=tests/test_hitl_postgres_restart_phase6.py \
            --ignore=tests/test_supabase_migration_replay_phase8a.py

      - name: Build production container
        run: docker build --tag teamflow/hiring-agent:${{ github.sha }} services/hiring-agent

  deploy:
    name: Stage, Verify & Promote Hiring Agent
    needs: predeploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: teamflow-hiring-agent
      REGION: us-central1
      REVISION_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
      GOOGLE_API_KEY_SECRET_VERSION: ${{ vars.GOOGLE_API_KEY_SECRET_VERSION }}
      SUPABASE_URL_SECRET_VERSION: ${{ vars.SUPABASE_URL_SECRET_VERSION }}
      SUPABASE_TRUSTED_ORIGIN_SECRET_VERSION: ${{ vars.SUPABASE_TRUSTED_ORIGIN_SECRET_VERSION }}
      SUPABASE_PUBLISHABLE_KEY_SECRET_VERSION: ${{ vars.SUPABASE_PUBLISHABLE_KEY_SECRET_VERSION }}
      SUPABASE_HIRING_READER_TOKEN_SECRET_VERSION: ${{ vars.SUPABASE_HIRING_READER_TOKEN_SECRET_VERSION }}
      HIRING_AGENT_TOKEN_SECRET_VERSION: ${{ vars.HIRING_AGENT_TOKEN_SECRET_VERSION }}
      HIRING_AGENT_CANARY_MERCHANT_ID: ${{ vars.HIRING_AGENT_CANARY_MERCHANT_ID }}
      HIRING_AGENT_CANARY_CANDIDATE_ID: ${{ vars.HIRING_AGENT_CANARY_CANDIDATE_ID }}
      HIRING_AGENT_CANARY_ROLE_ID: ${{ vars.HIRING_AGENT_CANARY_ROLE_ID }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.HIRING_AGENT_RUNTIME_SERVICE_ACCOUNT }}
      BUILD_SERVICE_ACCOUNT: ${{ vars.HIRING_AGENT_BUILD_SERVICE_ACCOUNT }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production configuration
        run: |
          set -euo pipefail
          for name in GOOGLE_API_KEY_SECRET_VERSION SUPABASE_URL_SECRET_VERSION SUPABASE_TRUSTED_ORIGIN_SECRET_VERSION SUPABASE_PUBLISHABLE_KEY_SECRET_VERSION SUPABASE_HIRING_READER_TOKEN_SECRET_VERSION HIRING_AGENT_TOKEN_SECRET_VERSION; do
            if [[ ! "${!name:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$name must be a configured numeric Secret Manager version"
              exit 1
            fi
          done
          for name in HIRING_AGENT_CANARY_MERCHANT_ID HIRING_AGENT_CANARY_CANDIDATE_ID HIRING_AGENT_CANARY_ROLE_ID; do
            if [[ ! "${!name:-}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "::error::$name must be a configured canonical lowercase UUID"
              exit 1
            fi
          done
          if [[ ! "$RUNTIME_SERVICE_ACCOUNT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::HIRING_AGENT_RUNTIME_SERVICE_ACCOUNT must be a dedicated service-account email"
            exit 1
          fi
          if [[ ! "$BUILD_SERVICE_ACCOUNT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::HIRING_AGENT_BUILD_SERVICE_ACCOUNT must be a dedicated service-account email"
            exit 1
          fi
          if [[ ! "$ARTIFACT_REPOSITORY" =~ ^[a-z][a-z0-9._-]{0,62}$ ]]; then
            echo "::error::ARTIFACT_REPOSITORY must name an existing regional Docker repository"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '582.0.0'

      - name: Capture current traffic
        id: capture
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json 2>/dev/null || true)"
          if [[ -z "$service_json" ]]; then
            echo "::error::Production service must be bootstrapped and verified before automated rollout"
            exit 1
          fi
          iam_json="$(gcloud run services get-iam-policy "$SERVICE" --region "$REGION" --format=json)"
          public_invoker="$(jq -r '[.bindings[]? | select(.role == "roles/run.invoker" and .condition == null) | .members[]? | select(. == "allUsers")] | length' <<<"$iam_json")"
          if [[ "$public_invoker" != "1" ]]; then
            echo "::error::Cloud Run must be preprovisioned with one unconditional allUsers roles/run.invoker binding; application tokens remain mandatory"
            exit 1
          fi
          ingress="$(jq -r '.metadata.annotations["run.googleapis.com/ingress"] // "all"' <<<"$service_json")"
          if [[ "$ingress" != "all" ]]; then
            echo "::error::Cloud Run ingress must be preprovisioned as all for the public platform-invocation posture"
            exit 1
          fi
          previous_revision="$(jq -r '[.status.traffic[]? | select(.percent == 100 and .revisionName != null)] | if length == 1 then .[0].revisionName else empty end' <<<"$service_json")"
          if [[ -z "$previous_revision" ]]; then
            echo "::error::Expected exactly one existing revision at 100% traffic before rollout"
            exit 1
          fi
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Build, scan, and publish immutable image
        id: artifact
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          env_canary="services/hiring-agent/.env.release-hardening-canary"
          creds_canary="services/hiring-agent/gha-creds-release-hardening-canary.json"
          trap 'rm -f "$env_canary" "$creds_canary"' EXIT
          : > "$env_canary"
          : > "$creds_canary"
          upload_manifest="$(cd services/hiring-agent && gcloud meta list-files-for-upload)"
          if grep -Eq '(^|/)(\.env[^/]*|gha-creds-[^/]*\.json)$' <<<"$upload_manifest"; then
            echo "::error::Cloud Build source archive includes an environment or generated OIDC credential file"
            exit 1
          fi
          image_name="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/teamflow-hiring-agent"
          image_tag="$image_name:git-$GITHUB_SHA-run-$GITHUB_RUN_ATTEMPT"
          gcloud builds submit services/hiring-agent \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --config services/hiring-agent/cloudbuild.release.yaml \
            --service-account "projects/$PROJECT_ID/serviceAccounts/$BUILD_SERVICE_ACCOUNT" \
            --substitutions "_IMAGE_URI=$image_tag" \
            --format=json > /tmp/cloud-build.json
          build_status="$(jq -r '.status // empty' /tmp/cloud-build.json)"
          build_id="$(jq -r '.id // empty' /tmp/cloud-build.json)"
          image_digest="$(jq -r '.results.images[0].digest // empty' /tmp/cloud-build.json)"
          if [[ "$build_status" != "SUCCESS" || -z "$build_id" || ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cloud Build did not produce one successful immutable image"
            exit 1
          fi
          image_ref="$image_name@$image_digest"
          {
            echo "build_id=$build_id"
            echo "image_digest=$image_digest"
            echo "image_ref=$image_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Verify provenance and generate SBOM
        env:
          IMAGE_REF: ${{ steps.artifact.outputs.image_ref }}
        run: |
          set -euo pipefail
          sbom_ready=false
          for attempt in {1..18}; do
            if gcloud artifacts sbom export --uri="$IMAGE_REF" --location="$REGION" \
              >/tmp/sbom-export.out 2>/tmp/sbom-export.err; then
              sbom_ready=true
              break
            fi
            sleep 10
          done
          if [[ "$sbom_ready" != "true" ]]; then
            echo "::error::Artifact Analysis did not generate an SBOM"
            exit 1
          fi
          metadata_ready=false
          for attempt in {1..12}; do
            if gcloud artifacts docker images describe "$IMAGE_REF" \
              --show-provenance --show-sbom-references --format=json \
              > /tmp/artifact-metadata.json \
              && jq -e '.provenance_summary.provenance | length > 0' /tmp/artifact-metadata.json >/dev/null \
              && jq -e '.image_summary.sbom_locations | length > 0' /tmp/artifact-metadata.json >/dev/null; then
              metadata_ready=true
              break
            fi
            sleep 10
          done
          if [[ "$metadata_ready" != "true" ]]; then
            echo "::error::Signed build provenance or SBOM reference is missing"
            exit 1
          fi

      - name: Deploy candidate at zero traffic
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: teamflow-hiring-agent
          region: us-central1
          project_id: ${{ steps.auth.outputs.project_id }}
          image: ${{ steps.artifact.outputs.image_ref }}
          tag: ${{ env.REVISION_TAG }}
          no_traffic: true
          gcloud_version: '582.0.0'
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          flags: >-
            --cpu=1 --memory=1Gi --min-instances=0 --max-instances=10
            --port=8080 --timeout=60 --concurrency=4
            --startup-probe=httpGet.path=/ready,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=12,timeoutSeconds=5,periodSeconds=5
            --liveness-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=30,failureThreshold=3,timeoutSeconds=5,periodSeconds=10
            --execution-environment=gen2 --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
          env_vars: |
            ENVIRONMENT=production
            HIRING_AGENT_MODEL=gemini-3.7-flash
            HIRING_AGENT_FALLBACK_MODEL=gemini-3.6-flash
            HIRING_AGENT_MAX_TOOL_ROUNDS=2
            HIRING_AGENT_MAX_TOOL_CALLS_PER_ROUND=3
            HIRING_AGENT_MODEL_TIMEOUT_SECONDS=12
            HIRING_AGENT_TIMEOUT_SECONDS=45
            HIRING_AGENT_MAX_CONCURRENCY=4
            HIRING_AGENT_QUEUE_TIMEOUT_SECONDS=1
            HIRING_AGENT_MAX_REQUEST_BYTES=65536
            HIRING_AGENT_MOCK_TOOLS=false
            AGENT_ALLOW_WRITES=false
            TEAMFLOW_HITL_ENABLED=false
            TEAMFLOW_HITL_DB_MIN_POOL_SIZE=1
            TEAMFLOW_HITL_DB_MAX_POOL_SIZE=4
            TEAMFLOW_CHECKPOINT_MIN_POOL_SIZE=1
            TEAMFLOW_CHECKPOINT_MAX_POOL_SIZE=2
            TEAMFLOW_HITL_AUTH_TIMEOUT_SECONDS=5
            TEAMFLOW_HITL_MAX_CONCURRENCY=4
            TEAMFLOW_HITL_QUEUE_TIMEOUT_SECONDS=1
            TEAMFLOW_HITL_START_TIMEOUT_SECONDS=45
            TEAMFLOW_HITL_DECISION_TIMEOUT_SECONDS=15
            TEAMFLOW_HITL_INSPECT_TIMEOUT_SECONDS=5
            TEAMFLOW_HITL_MAX_DECISION_REQUEST_BYTES=524288
            OTEL_SERVICE_NAME=teamflow-hiring-agent
            OTEL_PROPAGATORS=tracecontext
            GOOGLE_CLOUD_PROJECT=${{ steps.auth.outputs.project_id }}
          secrets: |
            GOOGLE_API_KEY=GOOGLE_API_KEY:${{ env.GOOGLE_API_KEY_SECRET_VERSION }}
            SUPABASE_URL=SUPABASE_URL:${{ env.SUPABASE_URL_SECRET_VERSION }}
            SUPABASE_TRUSTED_ORIGIN=SUPABASE_TRUSTED_ORIGIN:${{ env.SUPABASE_TRUSTED_ORIGIN_SECRET_VERSION }}
            SUPABASE_PUBLISHABLE_KEY=SUPABASE_PUBLISHABLE_KEY:${{ env.SUPABASE_PUBLISHABLE_KEY_SECRET_VERSION }}
            SUPABASE_HIRING_READER_TOKEN=SUPABASE_HIRING_READER_TOKEN:${{ env.SUPABASE_HIRING_READER_TOKEN_SECRET_VERSION }}
            HIRING_AGENT_TOKEN=HIRING_AGENT_TOKEN:${{ env.HIRING_AGENT_TOKEN_SECRET_VERSION }}

      - name: Verify candidate provenance
        id: provenance
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          candidate_revision="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$service_json")"
          candidate_url="$(jq -r --arg tag "$REVISION_TAG" '[.status.traffic[]? | select(.tag == $tag)] | if length == 1 then .[0].url else empty end' <<<"$service_json")"
          tagged_revision="$(jq -r --arg tag "$REVISION_TAG" '[.status.traffic[]? | select(.tag == $tag)] | if length == 1 then .[0].revisionName else empty end' <<<"$service_json")"
          service_url="$(jq -r '.status.url // empty' <<<"$service_json")"
          if [[ -z "$candidate_revision" || "$tagged_revision" != "$candidate_revision" || -z "$candidate_url" || -z "$service_url" ]]; then
            echo "::error::Candidate tag did not resolve uniquely to the newly created revision"
            exit 1
          fi
          deployed_sha="$(gcloud run revisions describe "$candidate_revision" --region "$REGION" --format='value(metadata.labels.commit-sha)')"
          image_digest="$(gcloud run revisions describe "$candidate_revision" --region "$REGION" --format='value(status.imageDigest)')"
          if [[ "$deployed_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Candidate commit label does not match the workflow commit"
            exit 1
          fi
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Candidate did not report an immutable image digest"
            exit 1
          fi
          if [[ "$image_digest" != "${{ steps.artifact.outputs.image_digest }}" ]]; then
            echo "::error::Candidate digest does not match the scanned release artifact"
            exit 1
          fi
          {
            echo "candidate_revision=$candidate_revision"
            echo "candidate_url=$candidate_url"
            echo "service_url=$service_url"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Probe candidate readiness
        env:
          CANDIDATE_URL: ${{ steps.provenance.outputs.candidate_url }}
          SERVICE_URL: ${{ steps.provenance.outputs.service_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output /tmp/readiness.json --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 \
              "$CANDIDATE_URL/ready" || true)"
            if [[ "$status" == "200" ]] && jq -e '.status == "ready"' /tmp/readiness.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Candidate readiness did not become healthy"
          exit 1

      - name: Run candidate public identity canary
        env:
          CANDIDATE_URL: ${{ steps.provenance.outputs.candidate_url }}
        run: |
          set -euo pipefail
          health_status="$(curl --silent --show-error --output /tmp/candidate-health.json --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 10 "$CANDIDATE_URL/health")"
          version_status="$(curl --silent --show-error --output /tmp/candidate-version.json --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 10 "$CANDIDATE_URL/version")"
          [[ "$health_status" == "200" ]]
          [[ "$version_status" == "200" ]]
          jq -e '.status == "ok"' /tmp/candidate-health.json >/dev/null
          jq -e '.service == "teamflow-hiring-agent"' /tmp/candidate-version.json >/dev/null

      - name: Run candidate authenticated hiring canary
        env:
          CANDIDATE_URL: ${{ steps.provenance.outputs.candidate_url }}
        run: |
          set -euo pipefail
          agent_token="$(gcloud secrets versions access "$HIRING_AGENT_TOKEN_SECRET_VERSION" \
            --secret=HIRING_AGENT_TOKEN)"
          echo "::add-mask::$agent_token"
          request_id="$(tr '[:upper:]' '[:lower:]' </proc/sys/kernel/random/uuid)"
          jq -n \
            --arg merchant "$HIRING_AGENT_CANARY_MERCHANT_ID" \
            --arg candidate "$HIRING_AGENT_CANARY_CANDIDATE_ID" \
            --arg role "$HIRING_AGENT_CANARY_ROLE_ID" \
            --arg request "$request_id" \
            '{merchantId:$merchant,candidateId:$candidate,roleId:$role,requestId:$request,operation:"review_candidate"}' \
            >/tmp/candidate-hiring-request.json
          trap 'unset agent_token; rm -f /tmp/candidate-hiring-request.json /tmp/candidate-hiring-response.json' EXIT
          status="$(curl --silent --show-error --output /tmp/candidate-hiring-response.json \
            --write-out '%{http_code}' --connect-timeout 5 --max-time 55 \
            --max-filesize 2097152 --request POST \
            --header "X-Agent-Token: $agent_token" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/candidate-hiring-request.json \
            "$CANDIDATE_URL/invoke")"
          [[ "$status" == "200" ]]
          jq -e --arg request "$request_id" '
            .request_id == $request
            and .status == "complete"
            and .write_status == "not_requested"
            and (.tool_calls | index("get_candidate") != null)
            and (.tool_calls | index("get_job_requirements") != null)
          ' /tmp/candidate-hiring-response.json >/dev/null

      - name: Remove and verify candidate traffic tag
        id: candidate_tag
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        env:
          CANDIDATE_REVISION: ${{ steps.provenance.outputs.candidate_revision }}
          PREVIOUS_REVISION: ${{ steps.capture.outputs.previous_revision }}
        run: |
          set -euo pipefail
          if ! gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --remove-tags="$REVISION_TAG" --quiet; then
            echo "::error::Candidate tag cleanup failed; the zero-traffic revision may remain directly reachable"
            exit 1
          fi

          service_json="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          candidate_revision="$CANDIDATE_REVISION"
          if [[ -z "$candidate_revision" ]]; then
            candidate_revision="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$service_json")"
          fi
          if [[ -z "$candidate_revision" ]]; then
            echo "::error::Candidate tag cleanup failed closed; candidate revision is unavailable"
            exit 1
          fi
          tag_count="$(jq -r --arg tag "$REVISION_TAG" \
            '[.status.traffic[]? | select(.tag == $tag)] | length' <<<"$service_json")"
          candidate_percent="$(jq -r --arg revision "$candidate_revision" \
            '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<<"$service_json")"
          previous_percent="$(jq -r --arg revision "$PREVIOUS_REVISION" \
            '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<<"$service_json")"
          if [[ "$tag_count" != "0" || "$candidate_percent" != "0" || "$previous_percent" != "100" ]]; then
            echo "::error::Candidate tag cleanup failed closed; pre-promotion traffic invariants were not preserved"
            exit 1
          fi

      - name: Promote candidate revision
        id: promote
        if: ${{ success() && steps.candidate_tag.outcome == 'success' }}
        env:
          CANDIDATE_REVISION: ${{ steps.provenance.outputs.candidate_revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE" --region "$REGION"
          --to-revisions="${CANDIDATE_REVISION}=100" --quiet

      - name: Verify promoted readiness
        id: smoke
        env:
          SERVICE_URL: ${{ steps.provenance.outputs.service_url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/promoted-readiness.json --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 15 \
            "$SERVICE_URL/ready")"
          [[ "$status" == "200" ]]
          jq -e '.status == "ready"' /tmp/promoted-readiness.json >/dev/null

      - name: Rollback traffic
        id: rollback
        if: >-
          ${{ always() && steps.deploy.outcome == 'success' &&
              steps.candidate_tag.outcome == 'success' &&
              steps.capture.outputs.previous_revision != '' &&
              steps.promote.outcome != 'skipped' &&
              (steps.promote.outcome != 'success' || steps.smoke.outcome != 'success') }}
        env:
          PREVIOUS_REVISION: ${{ steps.capture.outputs.previous_revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE" --region "$REGION"
          --to-revisions="${PREVIOUS_REVISION}=100" --quiet

      - name: Verify rollback readiness
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          SERVICE_URL: ${{ steps.provenance.outputs.service_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output /tmp/rollback-readiness.json --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 "$SERVICE_URL/ready" || true)"
            if [[ "$status" == "200" ]] && jq -e '.status == "ready"' /tmp/rollback-readiness.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Previous revision did not become ready after rollback"
          exit 1

      - name: Record immutable deployment
        if: ${{ steps.smoke.outcome == 'success' }}
        run: |
          {
            echo "### Hiring-agent deployment"
            echo "- Revision: ${{ steps.provenance.outputs.candidate_revision }}"
            echo "- Image: ${{ steps.provenance.outputs.image_digest }}"
            echo "- Cloud Build: ${{ steps.artifact.outputs.build_id }}"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
